title: NvContainer.exe Running Outside The NVIDIA Install Directory
id: 4f1b2a6e-6c0d-4c37-9a55-0d7a3b8c1e42
status: experimental
description: >
    Detects a process named NvContainer.exe started from a path other than the
    NVIDIA installation directories. The analysed DiscAuth loader uses this name.
date: 2026-11-25
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\NvContainer.exe'
    filter_nvidia:
        Image|startswith:
            - 'C:\Program Files\NVIDIA Corporation\'
            - 'C:\Program Files (x86)\NVIDIA Corporation\'
            - 'C:\Windows\System32\DriverStore\FileRepository\nv'
    condition: selection and not filter_nvidia
falsepositives:
    - NVIDIA software unpacked to a temporary directory by its installer
level: medium
